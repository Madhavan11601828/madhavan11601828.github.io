---
layout: default
---

<article class="page">
    <header class="page-header">
        <h1 class="page-title">{{ page.title }}</h1>
        {% if page.subtitle %}
            <p class="page-subtitle">{{ page.subtitle }}</p>
        {% endif %}
    </header>
    
    <div class="page-content">
        {{ content }}
    </div>
</article>

<style>
    .page {
        max-width: 1000px;
        margin: 0 auto;
        padding: 60px 20px;
    }

    .page-header {
        margin-bottom: 40px;
        padding-bottom: 30px;
        border-bottom: 2px solid var(--border-color);
    }

    .page-title {
        font-size: 2.5em;
        margin: 0 0 15px 0;
        color: var(--text-primary);
    }

    .page-subtitle {
        font-size: 1.2em;
        color: var(--text-secondary);
        margin: 0;
    }

    .page-content {
        line-height: 1.8;
        font-size: 1.05em;
    }

    .page-content h2 {
        margin-top: 40px;
        margin-bottom: 20px;
        font-size: 1.8em;
        color: var(--text-primary);
        padding-bottom: 10px;
        border-bottom: 1px solid var(--border-color);
    }

    .page-content h3 {
        margin-top: 30px;
        margin-bottom: 15px;
        font-size: 1.4em;
        color: var(--text-primary);
    }

    .page-content p {
        margin-bottom: 15px;
        color: var(--text-secondary);
    }

    .page-content ul,
    .page-content ol {
        margin: 20px 0;
        padding-left: 30px;
    }

    .page-content li {
        margin-bottom: 10px;
        color: var(--text-secondary);
    }

    @media (max-width: 768px) {
        .page {
            padding: 40px 15px;
        }

        .page-title {
            font-size: 1.8em;
        }

        .page-content h2 {
            font-size: 1.4em;
        }

        .page-content h3 {
            font-size: 1.1em;
        }
    }
</style>
